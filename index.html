<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF7F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="daymoire">
<title>daymoire</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23FAF7F2'/%3E%3Cg fill='%23DFA6A3' transform='translate(32 32)'%3E%3Ccircle cy='-11' r='8'/%3E%3Ccircle cx='10.5' cy='-3.4' r='8'/%3E%3Ccircle cx='6.5' cy='8.9' r='8'/%3E%3Ccircle cx='-6.5' cy='8.9' r='8'/%3E%3Ccircle cx='-10.5' cy='-3.4' r='8'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='5' fill='%23E8DDBF'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23FAF7F2'/%3E%3Cg fill='%23DFA6A3' transform='translate(32 32)'%3E%3Ccircle cy='-11' r='8'/%3E%3Ccircle cx='10.5' cy='-3.4' r='8'/%3E%3Ccircle cx='6.5' cy='8.9' r='8'/%3E%3Ccircle cx='-6.5' cy='8.9' r='8'/%3E%3Ccircle cx='-10.5' cy='-3.4' r='8'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='5' fill='%23E8DDBF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#FAF7F2;--card:#fff;--rose:#DFA6A3;--rose-soft:#F6E6E4;--rose-deep:#B57A76;--butter:#E8DDBF;--butter-soft:#F5EFDF;--butter-ink:#8A7A4E;--sage:#A8B5A0;--sage-soft:#E6EBE2;--sage-deep:#6F7D67;--ink:#514A46;--mute:#9B918A;--line:#EDE6DC;--shadow:0 1px 3px rgba(81,74,70,.04),0 14px 34px -16px rgba(81,74,70,.16);--serif:'Gowun Batang',Georgia,serif;--sans:'IBM Plex Sans KR',-apple-system,system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
input,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--rose-deep);outline-offset:2px}
h1,h2,p{margin:0}
ul,ol{margin:0}
ul{list-style:none;padding:0}
svg.i{display:block;flex-shrink:0}

.shell{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;padding:calc(24px + env(safe-area-inset-top)) 20px calc(108px + env(safe-area-inset-bottom))}
.wrap{max-width:1024px;margin:0 auto}
@media(min-width:768px){
 .side{display:flex;flex-direction:column;align-self:flex-start;position:sticky;top:0;height:100vh;width:240px;flex-shrink:0;border-right:1px solid var(--line);padding:40px 24px}
 .main{padding:48px 48px 64px}
 .bnav,.m-logo{display:none!important}
}
.logo{display:inline-flex;align-items:flex-start;gap:5px;font-family:var(--serif);font-size:22px;letter-spacing:-.01em}
.logo svg{margin-top:1px}
.side .logo{margin-bottom:48px}
.side nav{display:flex;flex-direction:column;gap:4px}
.side a{display:flex;align-items:center;gap:12px;border-radius:999px;padding:10px 16px;font-size:14px;letter-spacing:.03em;color:var(--mute)}
.side a:hover{background:var(--card);color:var(--ink)}
.side a.on{background:var(--rose-soft);color:var(--ink);font-weight:600}
.side .motto{margin-top:auto;font-family:var(--serif);font-size:14px;line-height:1.7;color:var(--mute)}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(250,247,242,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bnav ul{display:grid;grid-template-columns:repeat(4,1fr);max-width:480px;margin:0 auto}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;font-size:11px;letter-spacing:.03em;color:var(--mute)}
.bnav .pill{display:grid;place-items:center;width:48px;height:32px;border-radius:999px}
.bnav a.on{color:var(--ink);font-weight:600}
.bnav a.on .pill{background:var(--rose-soft)}
.m-logo{margin-bottom:24px}

.page-head{margin-bottom:32px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head h1{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.15}
.page-head .sub{margin-top:8px;font-size:14px;color:var(--mute)}
.today-head{margin-bottom:40px}
.date-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 20px}
.big-date{font-family:var(--serif);font-weight:400;font-size:56px;line-height:1}
.dow{font-family:var(--serif);font-size:20px;color:var(--mute);padding-bottom:4px}
.dow span{margin-left:8px;font-size:15px}
@media(min-width:768px){.page-head h1{font-size:40px}.big-date{font-size:80px}.dow{font-size:24px;padding-bottom:8px}}
.greet{margin-top:16px}
.mood{margin-top:20px;max-width:560px;display:flex;align-items:center;gap:12px;border:1px dashed rgba(223,166,163,.7);border-radius:999px;background:rgba(255,255,255,.6);padding:0 20px}
.mood span{flex-shrink:0;font-family:var(--serif);font-size:14px;color:var(--rose-deep)}
.mood input{flex:1;min-width:0;height:48px;border:0;background:transparent;outline:none}
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.grid{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1024px){.g-today{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}.g-today .tall{grid-row:span 3}.g-inbox{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}}
.card{background:var(--card);border-radius:28px;padding:20px;box-shadow:var(--shadow)}
.card.sage{background:var(--sage-soft);box-shadow:none}
.card.butter{background:var(--butter-soft);box-shadow:none}
.card.rose{background:var(--rose-soft);box-shadow:none}
@media(min-width:768px){.card{padding:28px}}
.card h2{font-family:var(--serif);font-weight:400;font-size:20px}
.card h2.lg{font-size:24px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.note{font-size:12px;color:var(--mute);margin-top:4px}
.empty{padding:40px 0;text-align:center;font-size:14px;color:var(--mute);line-height:1.7}
.loading{padding:64px 0;text-align:center;font-size:14px;color:var(--mute)}

.btn{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 16px;border-radius:999px;background:var(--rose);font-size:14px;font-weight:600;flex-shrink:0}
.btn:disabled{opacity:.5}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:999px;color:var(--mute)}
.icon-btn:hover{background:var(--bg);color:var(--ink)}
.round{display:grid;place-items:center;width:44px;height:44px;border-radius:999px;background:var(--card);box-shadow:var(--shadow)}
.text-btn{height:44px;padding:0 12px;border-radius:999px;font-size:14px;color:var(--mute)}
.text-btn:hover{color:var(--ink)}

.tasks>li{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.tasks>li:first-child{border-top:0}
.butter .tasks>li{border-color:var(--butter)}
.check{margin:-6px;display:grid;place-items:center;width:44px;height:44px;flex-shrink:0}
.check span{display:grid;place-items:center;width:28px;height:28px;border-radius:999px;border:2px solid rgba(223,166,163,.7);background:var(--card);color:#fff;transition:background .15s}
.check:hover span{background:var(--rose-soft)}
.check.on span{border-color:var(--sage);background:var(--sage)}
.t-body{flex:1;min-width:0;padding-top:4px}
.t-title{word-break:break-word;line-height:1.4}
.done .t-title{color:var(--mute);text-decoration:line-through;text-decoration-color:rgba(223,166,163,.6)}
.t-meta{margin-top:6px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.badge{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:11px;font-weight:500}
.b-must{background:var(--rose-soft);color:var(--rose-deep)}
.b-home{background:var(--butter-soft);color:var(--butter-ink)}
.b-routine{background:var(--sage-soft);color:var(--sage-deep)}
.b-personal{background:var(--bg);color:var(--mute);border:1px solid var(--line)}
.b-high{background:var(--rose);color:var(--ink);font-weight:600}
.tiny{font-size:11px;color:var(--mute)}
.tiny.warn{color:var(--rose-deep)}
.t-memo{margin-top:6px;font-size:14px;line-height:1.6;color:var(--mute);white-space:pre-wrap;word-break:break-word}
.t-acts{display:flex;align-items:center;flex-shrink:0}
.to-today{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 12px;margin-right:4px;border-radius:999px;background:var(--butter-soft);font-size:12px;font-weight:500}
.butter .to-today{background:var(--card)}
.done-box{margin-top:16px;border-radius:18px;background:var(--bg);padding:12px 16px 4px}
.done-box .lb{font-size:12px;font-weight:500;color:var(--mute)}
.all-done{padding:24px 0;text-align:center;font-family:var(--serif);color:var(--mute)}

.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--rose);transition:width .5s}
.bar.sage i{background:var(--sage)}
.prog{margin-top:20px;display:grid;gap:16px}
.prog-row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.prog-row .mute{color:var(--mute)}
.pct{margin-left:8px;font-weight:600;color:var(--ink)}
.cnt{font-size:14px;color:var(--sage-deep)}

.r-grid{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.r-btn{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 14px;border-radius:18px;background:var(--bg);text-align:left;font-size:15px;transition:background .15s}
.r-btn:hover{background:var(--sage-soft)}
.r-btn .dot{display:grid;place-items:center;width:24px;height:24px;border-radius:999px;border:2px solid var(--sage);flex-shrink:0}
.r-btn.on{background:var(--sage);color:#fff}
.r-btn.on .dot{border-color:#fff}

.free{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}
.free li{display:flex;align-items:center;height:40px;padding:0 4px 0 16px;border-radius:999px;background:var(--card);font-size:14px}
.free li button{display:grid;place-items:center;width:32px;height:32px;margin-left:2px;border-radius:999px;color:var(--mute)}
.add-row{margin-top:12px;display:flex;gap:8px}
.field{height:44px;min-width:0;flex:1;border:1px solid var(--line);border-radius:999px;background:var(--card);padding:0 16px;outline:none}
.field:focus{border-color:var(--rose)!important}
.add-row .field{border-color:var(--butter)}
.add-row .sq{display:grid;place-items:center;width:44px;height:44px;border-radius:999px;background:var(--butter);flex-shrink:0}

.goals{display:grid;gap:16px 40px;margin-top:20px}
@media(min-width:768px){.goals{grid-template-columns:1fr 1fr}}
.goal-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;margin-bottom:6px}
.goal-top .l{display:flex;align-items:center;gap:6px}
.goal-top small{font-size:12px;color:var(--mute)}
.goal-top .n{color:var(--mute);font-variant-numeric:tabular-nums}
.star{color:#C9B57A}
.scroll-x{overflow-x:auto;margin:16px -20px 0;padding:0 20px}
@media(min-width:768px){.scroll-x{margin:16px 0 0;padding:0}}
table.wk{width:100%;min-width:460px;border-collapse:separate;border-spacing:0 4px;font-size:14px}
table.wk th{font-weight:400}
table.wk th[scope=row]{text-align:left;padding-right:8px;white-space:nowrap}
.dayhead{margin:0 auto 8px;display:flex;flex-direction:column;align-items:center;width:40px;padding:4px 0;border-radius:16px;color:var(--mute)}
.dayhead small{font-size:11px}
.dayhead.on{background:var(--rose-soft);color:var(--ink);font-weight:600}
.cell{margin:0 auto;display:grid;place-items:center;width:40px;height:40px;border-radius:999px;background:var(--bg);color:transparent;transition:background .15s}
.cell:hover:not(:disabled){background:var(--sage-soft)}
.cell.on,.cell.on:hover:not(:disabled){background:var(--sage);color:#fff}
.cell:disabled{opacity:.45}
.days{margin-top:16px}
.days>li{display:flex;flex-direction:column;gap:12px;padding:12px 0;border-top:1px solid var(--butter)}
.days>li:first-child{border-top:0}
@media(min-width:768px){.days>li{flex-direction:row;align-items:center}}
.days .dl{width:80px;flex-shrink:0;font-size:14px;color:var(--mute)}
.days .dl.on{color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 16px;border-radius:999px;background:var(--card);font-size:14px;transition:background .15s}
.chip:hover:not(:disabled){background:var(--sage-soft)}
.chip.dim{color:rgba(155,145,138,.85)}
.chip.on,.chip.on:hover:not(:disabled){background:var(--sage);color:#fff;font-weight:600}
.chip.auto{background:var(--sage-soft);color:var(--sage-deep)}
.chip:disabled{opacity:.4}
.days .field{flex:none;width:100%;height:40px;font-size:14px;border-color:var(--butter)}
@media(min-width:768px){.days .field{flex:1;width:auto}}
.days .field:disabled{opacity:.4}

.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--card);box-shadow:var(--shadow)}
.seg button{height:40px;padding:0 20px;border-radius:999px;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--rose-soft);color:var(--ink);font-weight:600}
.toolbar{margin-bottom:24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.arrows{display:flex;align-items:center;gap:4px}
.ml-top{display:grid;gap:24px}
@media(min-width:768px){.ml-top{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}}
.rate{display:flex;flex-direction:column;justify-content:space-between}
.rate .num{margin-top:24px;font-family:var(--serif);font-size:72px;line-height:1}
.rate .num small{font-size:24px;margin-left:4px}
.rate .cap{margin-top:12px;font-size:14px;color:var(--mute)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.tile p{font-size:14px;color:var(--mute)}
.tile .v{margin-top:12px;font-family:var(--serif);font-size:30px;color:var(--ink)}
.tile .v small{font-size:15px;color:var(--mute);margin-left:2px}
.flow-wrap{overflow-x:auto;margin-top:20px}
.flow{display:flex;align-items:flex-end;gap:6px;min-width:fit-content}
.flow .col{display:flex;flex-direction:column;align-items:center;gap:6px;width:28px;flex-shrink:0}
.flow .track{display:flex;align-items:flex-end;width:100%;height:112px;border-radius:999px;background:var(--bg);overflow:hidden}
.flow .fill{width:100%;border-radius:999px;background:var(--rose)}
.flow .fill.full{background:var(--sage)}
.flow .lb{font-size:10px;color:var(--mute)}
.flow .lb.on{color:var(--ink);font-weight:600}

.backdrop{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(81,74,70,.3)}
@media(min-width:640px){.backdrop{align-items:center;padding:16px}}
.dialog{width:100%;max-width:512px;max-height:92vh;overflow-y:auto;background:var(--card);border-radius:28px 28px 0 0;padding:24px 24px calc(24px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}
@media(min-width:640px){.dialog{border-radius:28px;padding-bottom:24px}}
.dialog h2{font-family:var(--serif);font-weight:400;font-size:20px}
.form{margin-top:20px;display:flex;flex-direction:column;gap:20px}
.lbl{display:block;font-size:14px;font-weight:500;margin-bottom:8px}
.inp{width:100%;height:48px;border:1px solid var(--line);border-radius:18px;background:var(--bg);padding:0 16px;outline:none}
textarea.inp{height:auto;padding:12px 16px;resize:vertical}
.inp:focus{border-color:var(--rose)}
.ochips{display:flex;flex-wrap:wrap;gap:8px}
.ochip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;color:var(--mute)}
.ochip small{margin-left:6px;font-size:12px;font-weight:400;color:var(--mute)}
.ochip.on{border-color:var(--rose);background:var(--rose-soft);color:var(--ink);font-weight:600}
.date-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.date-line .inp{width:auto;min-width:160px}
.err{font-size:14px;color:var(--rose-deep)}
.submit{height:48px;border-radius:999px;background:var(--rose);font-weight:600}
.submit:disabled{opacity:.5}

#toasts{position:fixed;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom));z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px;pointer-events:none}
@media(min-width:768px){#toasts{bottom:32px}}
.toast{max-width:380px;border-radius:18px;padding:12px 16px;font-size:14px;box-shadow:var(--shadow);background:var(--card);border:1px solid var(--line);pointer-events:auto}
.toast.error{background:var(--ink);color:#fff;border-color:var(--ink)}

.center{min-height:100vh;display:grid;place-items:center;padding:24px}
.center .box{width:100%;max-width:400px;text-align:center}
.center .logo{font-size:28px;margin-bottom:16px}
.center .box p{color:var(--mute);font-size:14px;line-height:1.7}
.center .box form{margin-top:24px;display:flex;flex-direction:column;gap:12px}
.err-card{margin:48px auto;max-width:440px;border:1px solid rgba(223,166,163,.4);border-radius:24px;background:var(--card);padding:24px;text-align:center}
.err-card p.t{font-weight:600;margin-bottom:4px}
.err-card p.m{margin-bottom:20px;font-size:14px;line-height:1.6;color:var(--mute)}
.setup{max-width:720px;margin:0 auto;padding:48px 20px}
.setup h1{font-family:var(--serif);font-weight:400;font-size:28px;margin:16px 0 8px}
.setup ol{padding-left:20px;line-height:1.9;margin:16px 0}
.setup code{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:13px}
.setup textarea{width:100%;height:260px;font:12px/1.5 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--card);margin-top:8px}

@media (pointer:coarse){input,textarea{font-size:16px!important}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toasts" aria-live="polite"></div>

<!--
  ================= daymoire DB 설정 SQL =================
  아래 <script id="setup-sql"> 안의 내용을 Supabase > SQL Editor 에 붙여넣고 Run 하세요.
  (페이지에 Supabase 값을 넣기 전에 열면 같은 SQL이 화면에 보이고 복사 버튼도 있어요.)
-->
<script type="text/plain" id="setup-sql">
-- ▼▼▼ 1. 아래 '여기에_접속키' 를 나만의 접속 키(영문·숫자 12자 이상)로 바꾸세요 ▼▼▼
create extension if not exists pgcrypto with schema extensions;

create table if not exists public.dm_secret (
  id int primary key default 1 check (id = 1),
  key_hash text not null
);
alter table public.dm_secret enable row level security;
revoke all on table public.dm_secret from anon, authenticated;

do $$
declare my_key text := '여기에_접속키';
begin
  if my_key = '여기에_접속키' or length(my_key) < 12 then
    raise exception '접속 키를 12자 이상의 나만의 값으로 바꾼 뒤 다시 실행해 주세요.';
  end if;
  insert into public.dm_secret (id, key_hash)
  values (1, encode(extensions.digest(my_key, 'sha256'), 'hex'))
  on conflict (id) do update set key_hash = excluded.key_hash;
end $$;
-- ▲▲▲ 여기까지만 바꾸면 됩니다. 나머지는 그대로 두세요. ▲▲▲

create table if not exists public.dm_tasks (
  id uuid primary key default gen_random_uuid(),
  title text not null check (length(btrim(title)) > 0),
  category text not null default 'personal' check (category in ('must','home','routine','personal')),
  priority text not null default 'medium' check (priority in ('high','medium','low')),
  due_date date,
  memo text,
  is_completed boolean not null default false,
  completed_at timestamptz,
  created_at timestamptz not null default now(),
  updated_at timestamptz not null default now()
);
create index if not exists dm_tasks_due_idx on public.dm_tasks (due_date);

create table if not exists public.dm_routines (
  id uuid primary key default gen_random_uuid(),
  title text not null,
  frequency text not null default 'daily' check (frequency in ('daily','weekly')),
  target_count int not null default 7,
  is_active boolean not null default true,
  sort_order int not null default 0,
  created_at timestamptz not null default now()
);

create table if not exists public.dm_routine_logs (
  id uuid primary key default gen_random_uuid(),
  routine_id uuid not null references public.dm_routines(id) on delete cascade,
  log_date date not null,
  is_completed boolean not null default false,
  created_at timestamptz not null default now(),
  unique (routine_id, log_date)
);

create table if not exists public.dm_daily_logs (
  id uuid primary key default gen_random_uuid(),
  log_date date not null unique,
  home_cooked boolean not null default false,
  exercised boolean not null default false,
  went_out boolean not null default false,
  memo text,
  mood text,
  created_at timestamptz not null default now(),
  updated_at timestamptz not null default now()
);

create table if not exists public.dm_free_activities (
  id uuid primary key default gen_random_uuid(),
  title text not null,
  category text,
  is_active boolean not null default true,
  created_at timestamptz not null default now()
);

-- 보안: 표는 전부 잠금. 페이지는 아래 함수로만, 접속 키가 맞을 때만 읽고 쓸 수 있음
alter table public.dm_tasks enable row level security;
alter table public.dm_routines enable row level security;
alter table public.dm_routine_logs enable row level security;
alter table public.dm_daily_logs enable row level security;
alter table public.dm_free_activities enable row level security;
revoke all on table public.dm_tasks, public.dm_routines, public.dm_routine_logs,
  public.dm_daily_logs, public.dm_free_activities from anon, authenticated;

create or replace function public.dm_auth(p_key text) returns void
language plpgsql security definer set search_path = public, extensions as $$
begin
  if p_key is null or not exists (
    select 1 from public.dm_secret where key_hash = encode(extensions.digest(p_key, 'sha256'), 'hex')
  ) then
    raise exception 'ACCESS_DENIED';
  end if;
end $$;

create or replace function public.dm_check(p_key text) returns boolean
language plpgsql security definer set search_path = public, extensions as $$
begin perform public.dm_auth(p_key); return true; end $$;

create or replace function public.dm_tasks_today(p_key text, p_date date, p_since timestamptz)
returns setof public.dm_tasks
language plpgsql security definer set search_path = public, extensions as $$
begin
  perform public.dm_auth(p_key);
  return query select * from public.dm_tasks t
  where t.due_date = p_date
     or (t.due_date < p_date and (t.is_completed = false or t.completed_at >= p_since))
  order by t.created_at;
end $$;

create or replace function public.dm_tasks_inbox(p_key text)
returns setof public.dm_tasks
language plpgsql security definer set search_path = public, extensions as $$
begin
  perform public.dm_auth(p_key);
  return query select * from public.dm_tasks t where t.due_date is null order by t.created_at;
end $$;

create or replace function public.dm_tasks_upcoming(p_key text, p_date date)
returns setof public.dm_tasks
language plpgsql security definer set search_path = public, extensions as $$
begin
  perform public.dm_auth(p_key);
  return query select * from public.dm_tasks t
  where t.due_date > p_date and t.is_completed = false order by t.due_date, t.created_at;
end $$;

create or replace function public.dm_task_save(p_key text, p_data jsonb)
returns public.dm_tasks
language plpgsql security definer set search_path = public, extensions as $$
declare r public.dm_tasks;
begin
  perform public.dm_auth(p_key);
  if p_data ? 'title' and coalesce(btrim(p_data->>'title'), '') = '' then
    raise exception '할 일 제목을 입력해 주세요.';
  end if;
  if coalesce(p_data->>'id', '') <> '' then
    update public.dm_tasks set
      title        = case when p_data ? 'title' then left(btrim(p_data->>'title'), 200) else title end,
      category     = case when p_data ? 'category' then p_data->>'category' else category end,
      priority     = case when p_data ? 'priority' then p_data->>'priority' else priority end,
      due_date     = case when p_data ? 'due_date' then nullif(p_data->>'due_date', '')::date else due_date end,
      memo         = case when p_data ? 'memo' then nullif(left(p_data->>'memo', 2000), '') else memo end,
      is_completed = case when p_data ? 'is_completed' then (p_data->>'is_completed')::boolean else is_completed end,
      completed_at = case when p_data ? 'is_completed'
                       then (case when (p_data->>'is_completed')::boolean then now() else null end)
                       else completed_at end,
      updated_at   = now()
    where id = (p_data->>'id')::uuid
    returning * into r;
    if not found then raise exception '해당 할 일을 찾을 수 없어요.'; end if;
  else
    if coalesce(btrim(p_data->>'title'), '') = '' then raise exception '할 일 제목을 입력해 주세요.'; end if;
    insert into public.dm_tasks (title, category, priority, due_date, memo)
    values (left(btrim(p_data->>'title'), 200),
            coalesce(p_data->>'category', 'personal'),
            coalesce(p_data->>'priority', 'medium'),
            nullif(p_data->>'due_date', '')::date,
            nullif(left(p_data->>'memo', 2000), ''))
    returning * into r;
  end if;
  return r;
end $$;

create or replace function public.dm_task_delete(p_key text, p_id uuid) returns void
language plpgsql security definer set search_path = public, extensions as $$
begin
  perform public.dm_auth(p_key);
  delete from public.dm_tasks where id = p_id;
end $$;

create or replace function public.dm_routines_list(p_key text)
returns setof public.dm_routines
language plpgsql security definer set search_path = public, extensions as $$
begin
  perform public.dm_auth(p_key);
  return query select * from public.dm_routines r where r.is_active order by r.sort_order, r.created_at;
end $$;

create or replace function public.dm_routine_logs_range(p_key text, p_from date, p_to date)
returns setof public.dm_routine_logs
language plpgsql security definer set search_path = public, extensions as $$
begin
  perform public.dm_auth(p_key);
  return query select * from public.dm_routine_logs l where l.log_date between p_from and p_to;
end $$;

create or replace function public.dm_routine_set(p_key text, p_routine uuid, p_date date, p_done boolean)
returns public.dm_routine_logs
language plpgsql security definer set search_path = public, extensions as $$
declare r public.dm_routine_logs;
begin
  perform public.dm_auth(p_key);
  insert into public.dm_routine_logs (routine_id, log_date, is_completed)
  values (p_routine, p_date, p_done)
  on conflict (routine_id, log_date) do update set is_completed = excluded.is_completed
  returning * into r;
  return r;
end $$;

create or replace function public.dm_daily_range(p_key text, p_from date, p_to date)
returns setof public.dm_daily_logs
language plpgsql security definer set search_path = public, extensions as $$
begin
  perform public.dm_auth(p_key);
  return query select * from public.dm_daily_logs d where d.log_date between p_from and p_to order by d.log_date;
end $$;

create or replace function public.dm_daily_set(p_key text, p_date date, p_data jsonb)
returns public.dm_daily_logs
language plpgsql security definer set search_path = public, extensions as $$
declare r public.dm_daily_logs;
begin
  perform public.dm_auth(p_key);
  insert into public.dm_daily_logs (log_date) values (p_date) on conflict (log_date) do nothing;
  update public.dm_daily_logs set
    home_cooked = case when p_data ? 'home_cooked' then (p_data->>'home_cooked')::boolean else home_cooked end,
    exercised   = case when p_data ? 'exercised' then (p_data->>'exercised')::boolean else exercised end,
    went_out    = case when p_data ? 'went_out' then (p_data->>'went_out')::boolean else went_out end,
    memo        = case when p_data ? 'memo' then nullif(left(p_data->>'memo', 500), '') else memo end,
    mood        = case when p_data ? 'mood' then nullif(left(p_data->>'mood', 200), '') else mood end,
    updated_at  = now()
  where log_date = p_date
  returning * into r;
  return r;
end $$;

create or replace function public.dm_free_list(p_key text)
returns setof public.dm_free_activities
language plpgsql security definer set search_path = public, extensions as $$
begin
  perform public.dm_auth(p_key);
  return query select * from public.dm_free_activities f where f.is_active order by f.created_at;
end $$;

create or replace function public.dm_free_add(p_key text, p_title text)
returns public.dm_free_activities
language plpgsql security definer set search_path = public, extensions as $$
declare r public.dm_free_activities;
begin
  perform public.dm_auth(p_key);
  if coalesce(btrim(p_title), '') = '' then raise exception '활동 이름을 입력해 주세요.'; end if;
  insert into public.dm_free_activities (title) values (left(btrim(p_title), 50)) returning * into r;
  return r;
end $$;

create or replace function public.dm_free_hide(p_key text, p_id uuid) returns void
language plpgsql security definer set search_path = public, extensions as $$
begin
  perform public.dm_auth(p_key);
  update public.dm_free_activities set is_active = false where id = p_id;
end $$;

<script>
/* ================================================================
   ▼ 설정: Supabase > Project Settings > API 에서 복사해 넣으세요 ▼
   - SUPABASE_URL      : Project URL (https://xxxx.supabase.co)
   - SUPABASE_ANON_KEY : anon public 키 (또는 Publishable key)
   ※ service_role / Secret 키는 절대 넣지 마세요.
   ================================================================ */
const SUPABASE_URL = '';
const SUPABASE_ANON_KEY = '';
/* ================================================================ */

const KEY_STORE = 'dm_access_key';
const DOW = ['일','월','화','수','목','금','토'];
const CATS = ['must','home','routine','personal'];
const CAT_LABEL = { must:'Must Do', home:'Home', routine:'Routine', personal:'Personal' };
const CAT_HINT = { must:'꼭 해야 하는 일', home:'집안일', routine:'생활 루틴', personal:'개인 일정' };
const PRIS = ['high','medium','low'];
const PRI_LABEL = { high:'높음', medium:'보통', low:'낮음' };

/* ---------- 날짜 ---------- */
const pad = n => String(n).padStart(2, '0');
const toStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const todayStr = () => toStr(new Date());
const addDays = (s, n) => { const d = parseDate(s); d.setDate(d.getDate()+n); return toStr(d); };
const weekStart = s => { const d = parseDate(s); const w = d.getDay(); d.setDate(d.getDate() + (w === 0 ? -6 : 1 - w)); return toStr(d); };
const rangeDays = (a, b) => { const o = []; for (let c = a; c <= b; c = addDays(c, 1)) o.push(c); return o; };
const monthStart = s => s.slice(0, 8) + '01';
const monthEnd = s => { const d = parseDate(monthStart(s)); d.setMonth(d.getMonth()+1); d.setDate(0); return toStr(d); };
const addMonths = (s, n) => { const d = parseDate(monthStart(s)); d.setMonth(d.getMonth()+n); return toStr(d); };
const fmtMD = s => { const d = parseDate(s); return `${d.getMonth()+1}월 ${d.getDate()}일`; };
const fmtShort = s => { const d = parseDate(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const dow = s => parseDate(s).getDay();
const lk = (rid, d) => rid + '|' + d;

/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const ICONS = {
  check:'<path d="M20 6 9 17l-5-5"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  pencil:'<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
  trash:'<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
  left:'<path d="m15 18-6-6 6-6"/>',
  right:'<path d="m9 18 6-6-6-6"/>',
  star:'<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/>',
  calplus:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M12 14v4M10 16h4"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
  inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  sprout:'<path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/>',
  refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>'
};
const icon = (n, size = 18, sw = 1.75) =>
  `<svg class="i" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
const flower = (s = 14) =>
  `<svg width="${s}" height="${s}" viewBox="-16 -16 32 32" aria-hidden="true"><g fill="#DFA6A3"><circle cy="-8" r="5.6"/><circle cx="7.6" cy="-2.5" r="5.6"/><circle cx="4.7" cy="6.5" r="5.6"/><circle cx="-4.7" cy="6.5" r="5.6"/><circle cx="-7.6" cy="-2.5" r="5.6"/></g><circle r="3.4" fill="#E8DDBF"/></svg>`;
const logo = (cls = '') => `<span class="logo ${cls}">daymoire${flower()}</span>`;

function toast(message, kind = 'info') {
  const el = document.createElement('div');
  el.className = 'toast' + (kind === 'error' ? ' error' : '');
  el.setAttribute('role', kind === 'error' ? 'alert' : 'status');
  el.textContent = message;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), kind === 'error' ? 5000 : 2500);
}

/* ---------- 상태 ---------- */
const S = {
  page: 'today', today: '', locked: false, loading: true, error: null,
  tasks: [], inbox: [], upcoming: [], routines: [], logs: {}, daily: {}, free: [],
  mood: '', freeNew: '', memoDraft: {}, showInboxDone: false,
  weekStart: '', mlPeriod: 'week', mlAnchor: '',
  modal: null, lockMsg: ''
};

/* ---------- Supabase ---------- */
let sb = null;
const getKey = () => { try { return localStorage.getItem(KEY_STORE) || ''; } catch { return ''; } };
const setKey = v => { try { v ? localStorage.setItem(KEY_STORE, v) : localStorage.removeItem(KEY_STORE); } catch {} };

function friendly(m = '') {
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return '네트워크에 연결할 수 없어요. 인터넷 연결을 확인해 주세요.';
  if (/Could not find the function|does not exist/i.test(m)) return 'DB 설정 SQL이 아직 실행되지 않았어요. Supabase SQL Editor에서 설정 SQL을 실행해 주세요.';
  if (/Invalid API key|JWT/i.test(m)) return 'Supabase 키가 맞지 않아요. 파일 위쪽 SUPABASE_ANON_KEY 값을 확인해 주세요.';
  return m;
}

async function rpc(fn, args = {}) {
  const { data, error } = await sb.rpc(fn, { p_key: getKey(), ...args });
  if (error) {
    if ((error.message || '').includes('ACCESS_DENIED')) {
      setKey('');
      S.locked = true;
      S.lockMsg = '접속 키가 맞지 않아요. 다시 입력해 주세요.';
      render();
      throw new Error('접속 키가 맞지 않아요.');
    }
    throw new Error(friendly(error.message));
  }
  return data;
}

/* ---------- 데이터 불러오기 ---------- */
const setLogs = list => { S.logs = {}; for (const l of list) if (l.is_completed) S.logs[lk(l.routine_id, l.log_date)] = true; };
const setDaily = list => { S.daily = {}; S.memoDraft = {}; for (const l of list) { S.daily[l.log_date] = l; S.memoDraft[l.log_date] = l.memo || ''; } };

function mlRange() {
  if (S.mlPeriod === 'week') { const s = weekStart(S.mlAnchor); return { from: s, to: addDays(s, 6) }; }
  return { from: monthStart(S.mlAnchor), to: monthEnd(S.mlAnchor) };
}

const LOADERS = {
  async today() {
    const d = S.today;
    const [t, r, l, dl, f] = await Promise.all([
      rpc('dm_tasks_today', { p_date: d, p_since: parseDate(d).toISOString() }),
      rpc('dm_routines_list'),
      rpc('dm_routine_logs_range', { p_from: d, p_to: d }),
      rpc('dm_daily_range', { p_from: d, p_to: d }),
      rpc('dm_free_list')
    ]);
    S.tasks = t; S.routines = r; setLogs(l); setDaily(dl); S.free = f;
    S.mood = (dl[0] && dl[0].mood) || '';
  },
  async inbox() {
    const [a, b] = await Promise.all([rpc('dm_tasks_inbox'), rpc('dm_tasks_upcoming', { p_date: S.today })]);
    S.inbox = a; S.upcoming = b;
  },
  async weekly() {
    const s = S.weekStart, e = addDays(s, 6);
    const [r, l, dl] = await Promise.all([
      rpc('dm_routines_list'),
      rpc('dm_routine_logs_range', { p_from: s, p_to: e }),
      rpc('dm_daily_range', { p_from: s, p_to: e })
    ]);
    S.routines = r; setLogs(l); setDaily(dl);
  },
  async mylife() {
    const { from, to } = mlRange();
    const [r, l, dl] = await Promise.all([
      rpc('dm_routines_list'),
      rpc('dm_routine_logs_range', { p_from: from, p_to: to }),
      rpc('dm_daily_range', { p_from: from, p_to: to })
    ]);
    S.routines = r; setLogs(l); setDaily(dl);
  }
};

async function loadPage() {
  S.loading = true; S.error = null; render();
  try { await LOADERS[S.page](); } catch (e) { S.error = e.message; }
  S.loading = false;
  render();
}

async function refresh() {
  try { await LOADERS[S.page](); render(); } catch (e) { toast(e.message, 'error'); }
}

function route() {
  if (S.locked) { render(); return; }
  const h = (location.hash || '#today').slice(1);
  S.page = ['today', 'inbox', 'weekly', 'mylife'].includes(h) ? h : 'today';
  S.today = todayStr();
  if (!S.weekStart) S.weekStart = weekStart(S.today);
  if (!S.mlAnchor) S.mlAnchor = S.today;
  closeModal();
  window.scrollTo(0, 0);
  loadPage();
}

  { id: 'today', label: 'TODAY', icon: 'sun' },
  { id: 'inbox', label: 'INBOX', icon: 'inbox' },
  { id: 'weekly', label: 'WEEKLY', icon: 'cal' },

];

const viewSide = () => `
  <aside class="side">
    <a href="#today" style="padding:0;background:none">${logo()}</a>
    <nav>${NAV.map(n => `<a href="#${n.id}" class="${S.page === n.id ? 'on' : ''}">${icon(n.icon)}${n.label}</a>`).join('')}</nav>

const pageHead = (title, sub, right = '') => `
  <div class="m-logo">${logo()}</div>
  <header class="page-head"><div><h1>${title}</h1>${sub ? `<p class="sub">${sub}</p>` : ''}</div>${right}</header>`;

function body(fn) {
  if (S.loading) return `<p class="loading">불러오는 중…</p>`;
  if (S.error) return `
    <div class="err-card">
      <p class="t">데이터를 불러오지 못했어요</p>
      <p class="m">${esc(S.error)}</p>
      <button class="btn" data-act="retry">${icon('refresh', 16)}다시 불러오기</button>
    </div>`;
  return fn();
}

const bar = (v, tone = '') => `<div class="bar ${tone}" role="progressbar" aria-valuenow="${Math.round(Math.min(1, v) * 100)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${Math.max(0, Math.min(1, v)) * 100}%"></i></div>`;

function sortTasks(list) {
  const rank = { high: 0, medium: 1, low: 2 };
  return [...list].sort((a, b) =>
    a.is_completed !== b.is_completed ? (a.is_completed ? 1 : -1)
    : rank[a.priority] !== rank[b.priority] ? rank[a.priority] - rank[b.priority]
    : String(a.created_at).localeCompare(String(b.created_at)));
}

function taskItem(t, { moveToday = false, showDate = false } = {}) {
  const overdue = t.due_date && t.due_date < S.today;
  const done = t.is_completed;
  return `
  <li class="${done ? 'done' : ''}">
    <button class="check ${done ? 'on' : ''}" data-act="task-toggle" data-id="${t.id}" aria-pressed="${done}" aria-label="${esc(t.title)} ${done ? '완료 취소' : '완료'}"><span>${done ? icon('check', 16, 3) : ''}</span></button>
    <div class="t-body">
      <p class="t-title">${esc(t.title)}</p>
      <div class="t-meta">
        <span class="badge b-${t.category}">${CAT_LABEL[t.category]}</span>
        ${t.priority === 'high' ? `<span class="badge b-high">중요</span>` : ''}
        ${t.priority === 'low' ? `<span class="tiny">여유 있게</span>` : ''}
        ${overdue && !done ? `<span class="tiny warn">${fmtShort(t.due_date)}부터 이어진 일</span>` : ''}
        ${showDate && t.due_date && !overdue ? `<span class="tiny">${fmtMD(t.due_date)}</span>` : ''}
      </div>
      ${t.memo ? `<p class="t-memo">${esc(t.memo)}</p>` : ''}
    </div>
    <div class="t-acts">
      ${moveToday && !done ? `<button class="to-today" data-act="task-today" data-id="${t.id}">${icon('calplus', 14)}오늘로</button>` : ''}
      <button class="icon-btn" data-act="task-edit" data-id="${t.id}" aria-label="${esc(t.title)} 수정">${icon('pencil', 16)}</button>
      <button class="icon-btn" data-act="task-del" data-id="${t.id}" aria-label="${esc(t.title)} 삭제">${icon('trash', 16)}</button>
    </div>
  </li>`;
}

/* ---------- TODAY ---------- */
function greeting() {
  const h = new Date().getHours();
  if (h < 5) return '늦은 밤이에요. 오늘은 여기까지 해도 괜찮아요.';
  if (h < 12) return '좋은 아침이에요. 오늘은 무엇부터 해볼까요?';
  if (h < 18) return '오후도 천천히, 하나씩 해봐요.';
  return '오늘 하루도 수고했어요.';
}

function viewToday() {
  const d = S.today, dt = parseDate(d);
  const head = `
    <header class="today-head rise">
      <div class="m-logo">${logo()}</div>
      <div class="date-row">
        <h1 class="big-date">${fmtMD(d)}</h1>
        <p class="dow">${DOW[dt.getDay()]}요일<span>${dt.getFullYear()}</span></p>
      </div>
      <p class="greet">${greeting()}</p>
      <label class="mood"><span>오늘의 한 줄</span>
        <input id="mood" maxlength="80" placeholder="기분이나 짧은 다짐을 적어보세요" value="${esc(S.mood)}">
      </label>
    </header>`;

  return head + body(() => {
    const list = sortTasks(S.tasks);
    const open = list.filter(t => !t.is_completed), done = list.filter(t => t.is_completed);
    const rc = S.routines.filter(r => S.logs[lk(r.id, d)]).length;
    const tr = S.tasks.length ? done.length / S.tasks.length : 0;
    const rr = S.routines.length ? rc / S.routines.length : 0;

    const tasksCard = `
      <section class="card tall">
        <div class="row-between" style="margin-bottom:8px">
          <h2 class="lg">Today's Tasks</h2>
          <button class="btn" data-act="task-new">${icon('plus')}할 일 추가</button>
        </div>
        ${S.tasks.length === 0 ? `<p class="empty">오늘 정해둔 할 일이 없어요.<br>INBOX에서 오늘로 옮기거나 새로 추가해 보세요.</p>` : `
          <ul class="tasks">${open.map(t => taskItem(t)).join('')}</ul>
          ${open.length === 0 ? `<p class="all-done">오늘 할 일을 모두 마쳤어요.</p>` : ''}
          ${done.length ? `<div class="done-box"><p class="lb">완료한 일 ${done.length}</p><ul class="tasks">${done.map(t => taskItem(t)).join('')}</ul></div>` : ''}
        `}
      </section>`;

    const progress = `
      <section class="card sage">
        <div class="row-between"><h2>Daily Progress</h2><p class="cnt">완료 ${done.length + rc}개</p></div>
        <div class="prog">
          <div><div class="prog-row"><span>할 일</span><span class="mute">${done.length}/${S.tasks.length}<span class="pct">${Math.round(tr * 100)}%</span></span></div>${bar(tr)}</div>
          <div><div class="prog-row"><span>루틴</span><span class="mute">${rc}/${S.routines.length}<span class="pct">${Math.round(rr * 100)}%</span></span></div>${bar(rr, 'sage')}</div>
        </div>
      </section>`;

    const routine = `
      <section class="card">
        <h2>Today's Routine</h2>
        ${S.routines.length === 0 ? `<p class="empty" style="padding:16px 0">등록된 루틴이 없어요.</p>` : `
        <ul class="r-grid">${S.routines.map(r => {
          const on = !!S.logs[lk(r.id, d)];
          return `<li><button class="r-btn ${on ? 'on' : ''}" data-act="routine" data-id="${r.id}" data-date="${d}" aria-pressed="${on}"><span class="dot">${on ? icon('check', 14, 3) : ''}</span>${esc(r.title)}</button></li>`;
        }).join('')}</ul>`}
      </section>`;

    const free = `
      <section class="card butter">
        <h2>Free Time</h2>
        <p class="note">하고 싶을 때 하는 일이라 완료율에는 넣지 않아요.</p>
        <ul class="free">${S.free.map(a => `<li>${esc(a.title)}<button data-act="free-hide" data-id="${a.id}" aria-label="${esc(a.title)} 지우기">${icon('x', 14)}</button></li>`).join('')}</ul>
        <div class="add-row">
          <input id="free-new" class="field" maxlength="50" placeholder="하고 싶은 활동 추가" value="${esc(S.freeNew)}">
          <button class="sq" data-act="free-add" aria-label="활동 추가">${icon('plus')}</button>
        </div>

    return `<div class="grid g-today">${tasksCard}${progress}${routine}${free}</div>`;
  });
}

/* ---------- WEEKLY ---------- */
const wentOut = l => !!l && (l.went_out || l.exercised); // 헬스장 방문도 외출로 인정

function weeklyGoals(days) {
  const find = t => S.routines.find(r => r.title === t);
  const countR = r => r ? days.filter(d => S.logs[lk(r.id, d)]).length : 0;
  const rows = [];
  rows.push({ label: '헬스장', tl: '주 2~3회', count: days.filter(d => S.daily[d]?.exercised).length, target: 2 });
  for (const t of ['말해보카', '스픽']) { const r = find(t); if (r) rows.push({ label: t, tl: '매일', count: countR(r), target: 7 }); }
  rows.push({ label: '집밥', tl: '수~일요일', count: days.filter(d => [3,4,5,6,0].includes(dow(d)) && S.daily[d]?.home_cooked).length, target: 5 });
  const room = find('방 정리'); if (room) rows.push({ label: '방 정리', tl: '매일', count: countR(room), target: 7 });
  const sh = find('샤워'), wa = find('세안');
  if (sh && wa) rows.push({ label: '샤워 및 세안', tl: '매일', count: days.filter(d => S.logs[lk(sh.id, d)] && S.logs[lk(wa.id, d)]).length, target: 7 });
  const care = find('홈케어'); if (care) rows.push({ label: '홈케어', tl: '주 2~3회', count: countR(care), target: 2 });
  rows.push({ label: '외출', tl: '수~금 중 2일 이상', count: days.filter(d => [3,4,5].includes(dow(d)) && wentOut(S.daily[d])).length, target: 2 });
  const covered = ['말해보카', '스픽', '방 정리', '샤워', '세안', '홈케어'];
  for (const r of S.routines) {
    if (covered.includes(r.title)) continue;
    const target = r.frequency === 'daily' ? 7 : Math.max(1, r.target_count);
    rows.push({ label: r.title, tl: r.frequency === 'daily' ? '매일' : `주 ${target}회`, count: countR(r), target });
  }
  return rows;
}

function viewWeekly() {
  const s = S.weekStart, days = rangeDays(s, addDays(s, 6));
  const isThis = s === weekStart(S.today);
  const right = `<div class="arrows">
    <button class="round" data-act="week-prev" aria-label="지난주">${icon('left')}</button>
    ${isThis ? '' : `<button class="text-btn" data-act="week-this">이번 주</button>`}
    <button class="round" data-act="week-next" aria-label="다음 주">${icon('right')}</button></div>`;
  const head = pageHead('Weekly', `${fmtMD(days[0])} ~ ${fmtMD(days[6])}`, right);

  return head + body(() => {
    const goals = weeklyGoals(days);
    const met = goals.filter(g => g.count >= g.target).length;
    const goalsCard = `
      <section class="card">
        <div class="row-between" style="align-items:baseline">
          <h2 class="lg">${isThis ? '이번 주' : '그 주'} 목표</h2>
          <p style="font-size:14px;color:var(--mute)">${goals.length}개 중 <b style="color:var(--ink)">${met}개</b> 채웠어요</p>
        </div>
        <ul class="goals">${goals.map(g => {
          const ok = g.count >= g.target;
          return `<li><div class="goal-top"><span class="l">${esc(g.label)}<small>${g.tl}</small>${ok ? `<span class="star" aria-label="달성">${icon('star', 13, 1.5).replace('fill="none"', 'fill="#E8DDBF"')}</span>` : ''}</span><span class="n">${g.count}/${g.target}</span></div>${bar(g.count / g.target, ok ? 'sage' : '')}</li>`;
        }).join('')}</ul>
      </section>`;

    const table = `
      <section class="card">
        <h2>루틴 체크</h2>
        <div class="scroll-x"><table class="wk">
          <thead><tr><th></th>${days.map(d => `<th><span class="dayhead ${d === S.today ? 'on' : ''}">${DOW[dow(d)]}<small>${fmtShort(d)}</small></span></th>`).join('')}</tr></thead>
          <tbody>${S.routines.map(r => `<tr><th scope="row">${esc(r.title)}</th>${days.map(d => {
            const on = !!S.logs[lk(r.id, d)], future = d > S.today;
            return `<td><button class="cell ${on ? 'on' : ''}" data-act="routine" data-id="${r.id}" data-date="${d}" ${future ? 'disabled' : ''} aria-pressed="${on}" aria-label="${fmtMD(d)} ${esc(r.title)}">${icon('check', 16, 3)}</button></td>`;
          }).join('')}</tr>`).join('')}</tbody>
        </table></div>
      </section>`;

    const records = `
      <section class="card butter">
        <h2>생활 기록</h2>
        <p class="note">헬스장에 다녀온 날은 외출로도 함께 세어요.</p>
        <ul class="days">${days.map(d => {
          const l = S.daily[d] || {};
          const future = d > S.today;
          const cookDay = [3,4,5,6,0].includes(dow(d));
          const chip = (f, label, dim) => {
            const on = !!l[f], auto = f === 'went_out' && !on && l.exercised;
            return `<button class="chip ${on ? 'on' : auto ? 'auto' : dim ? 'dim' : ''}" data-act="daily" data-date="${d}" data-field="${f}" ${future ? 'disabled' : ''} aria-pressed="${on}">${auto ? '외출 (헬스)' : label}</button>`;
          };
          return `<li>
            <p class="dl ${d === S.today ? 'on' : ''}">${fmtShort(d)} ${DOW[dow(d)]}</p>
            <div class="chips">${chip('exercised', '운동')}${chip('home_cooked', '집밥', !cookDay)}${chip('went_out', '외출')}</div>
            <input class="field" data-memo="${d}" maxlength="200" ${future ? 'disabled' : ''} placeholder="${future ? '' : '운동 메모 (선택)'}" aria-label="${fmtMD(d)} 메모" value="${esc(S.memoDraft[d] || '')}">
          </li>`;
        }).join('')}</ul>
      </section>`;

    return `<div class="grid">${goalsCard}${table}${records}</div>`;
  });
}

/* ---------- MY LIFE ---------- */
function viewMyLife() {
  const { from, to } = mlRange();
  const isCur = from <= S.today && S.today <= to;
  const word = S.mlPeriod === 'week' ? '이번 주' : '이번 달';
  const prefix = isCur ? word : (S.mlPeriod === 'week' ? '그 주' : '그 달');
  const title = S.mlPeriod === 'week' ? `${fmtMD(from)} ~ ${fmtMD(to)}` : `${parseDate(from).getFullYear()}년 ${parseDate(from).getMonth() + 1}월`;

  const toolbar = `
    <div class="toolbar">
      <div class="seg" role="tablist">
        <button role="tab" class="${S.mlPeriod === 'week' ? 'on' : ''}" aria-selected="${S.mlPeriod === 'week'}" data-act="ml-period" data-val="week">주간</button>
        <button role="tab" class="${S.mlPeriod === 'month' ? 'on' : ''}" aria-selected="${S.mlPeriod === 'month'}" data-act="ml-period" data-val="month">월간</button>
      </div>
      <div class="arrows">
        <button class="round" data-act="ml-prev" aria-label="이전">${icon('left')}</button>
        ${isCur ? '' : `<button class="text-btn" data-act="ml-this">${word}</button>`}
        <button class="round" data-act="ml-next" aria-label="다음">${icon('right')}</button>
      </div>
    </div>`;

  return pageHead('My Life', title) + toolbar + body(() => {
    if (from > S.today) return `<p class="loading">아직 오지 않은 기간이에요.</p>`;
    const days = rangeDays(from, to < S.today ? to : S.today);
    const R = S.routines;
    const ids = t => R.filter(r => r.title === t).map(r => r.id);
    const eng = [...ids('말해보카'), ...ids('스픽')], room = ids('방 정리');
    const any = (d, list) => list.some(id => S.logs[lk(id, d)]);
    const doneOn = d => R.filter(r => S.logs[lk(r.id, d)]).length;
    const total = days.reduce((s, d) => s + doneOn(d), 0);
    const rate = R.length && days.length ? total / (R.length * days.length) : 0;
    const hasData = Object.keys(S.logs).length > 0 || Object.values(S.daily).some(l => l.exercised || l.home_cooked || l.went_out);

    if (!hasData) return `
      <section class="card" style="text-align:center;padding:56px 24px">
        <h2>아직 쌓인 기록이 없어요</h2>
        <p class="empty" style="padding:8px 0 0">TODAY에서 루틴을 체크하고 WEEKLY에 운동·집밥·외출을 남기면<br>이곳에 나의 생활이 조금씩 모여요.</p>
      </section>`;

    const tiles = [
      [`${prefix} 운동`, days.filter(d => S.daily[d]?.exercised).length, '회'],
      [`${prefix} 집밥`, days.filter(d => S.daily[d]?.home_cooked).length, '회'],
      ['영어 공부', days.filter(d => any(d, eng)).length, '일'],
      ['방 정리', days.filter(d => any(d, room)).length, '일'],
      ['외출', days.filter(d => wentOut(S.daily[d])).length, '일']
    ];

    return `
      <div class="grid">
        <div class="ml-top">
          <section class="card rose rate">
            <h2>전체 루틴 달성률</h2>
            <p class="num">${Math.round(rate * 100)}<small>%</small></p>
            <p class="cap">${days.length}일 동안 루틴 ${R.length}개 기준</p>
          </section>
          <section class="tiles">${tiles.map(([l, v, u]) => `<div class="tile"><p>${l}</p><p class="v">${v}<small>${u}</small></p></div>`).join('')}</section>
        </div>
        <section class="card">
          <h2>날짜별 루틴 흐름</h2>
          <div class="flow-wrap"><div class="flow">${rangeDays(from, to).map(d => {
            const r = d > S.today || !R.length ? 0 : doneOn(d) / R.length;
            return `<div class="col" title="${fmtMD(d)} ${Math.round(r * 100)}%">
              <div class="track"><div class="fill ${r >= 1 ? 'full' : ''}" style="height:${r > 0 ? Math.max(r * 100, 8) : 0}%"></div></div>
              <span class="lb ${d === S.today ? 'on' : ''}">${S.mlPeriod === 'week' ? DOW[dow(d)] : parseDate(d).getDate()}</span>
            </div>`;
          }).join('')}</div></div>
        </section>
      </div>`;
  });
}

/* ---------- 할 일 입력 창 ---------- */
function openModal(mode, t) {
  S.modal = {
    mode, id: t ? t.id : null, saving: false, error: '',
    v: t ? { title: t.title, category: t.category, priority: t.priority, due_date: t.due_date, memo: t.memo || '' }
         : { title: '', category: S.page === 'inbox' ? 'home' : 'must', priority: 'medium', due_date: S.page === 'inbox' ? null : S.today, memo: '' }
  };
  document.body.style.overflow = 'hidden';
  renderModal();
  const el = $('#m-title'); if (el) el.focus();
}

function closeModal() {
  S.modal = null;
  document.body.style.overflow = '';
  renderModal();
}

function renderModal() {
  const m = S.modal;
  if (!m) { $('#modal').innerHTML = ''; return; }
  const v = m.v;
  const oc = (on) => `ochip ${on ? 'on' : ''}`;
  $('#modal').innerHTML = `
  <div class="backdrop" data-act="m-close">
    <div class="dialog" role="dialog" aria-modal="true" aria-label="${m.mode === 'edit' ? '할 일 수정' : '새 할 일'}" data-act="noop">
      <div class="row-between">
        <h2>${m.mode === 'edit' ? '할 일 수정' : '새 할 일'}</h2>
        <button class="icon-btn" data-act="m-close" aria-label="닫기">${icon('x', 20)}</button>
      </div>
      <form class="form" data-form="task">
        <div><label class="lbl" for="m-title">제목</label>
          <input id="m-title" class="inp" maxlength="200" placeholder="무엇을 해볼까요?" value="${esc(v.title)}"></div>
        <div><span class="lbl">카테고리</span><div class="ochips">${CATS.map(c =>
          `<button type="button" class="${oc(v.category === c)}" data-act="m-cat" data-val="${c}">${CAT_LABEL[c]}<small>${CAT_HINT[c]}</small></button>`).join('')}</div></div>
        <div><span class="lbl">우선순위</span><div class="ochips">${PRIS.map(p =>
          `<button type="button" class="${oc(v.priority === p)}" data-act="m-pri" data-val="${p}">${PRI_LABEL[p]}</button>`).join('')}</div></div>
        <div><label class="lbl" for="m-date">날짜</label>
          <div class="date-line">
            <input id="m-date" type="date" class="inp" value="${v.due_date || ''}">
            <button type="button" class="${oc(v.due_date === S.today)}" data-act="m-today">오늘</button>
            <button type="button" class="${oc(!v.due_date)}" data-act="m-nodate">날짜 없음</button>
          </div>
          <p class="note" style="margin-top:8px">날짜를 비워두면 INBOX에 보관돼요.</p></div>
        <div><label class="lbl" for="m-memo">메모 (선택)</label>
          <textarea id="m-memo" class="inp" rows="3" maxlength="2000">${esc(v.memo)}</textarea></div>
        ${m.error ? `<p class="err" role="alert">${esc(m.error)}</p>` : ''}
        <button type="submit" class="submit" ${m.saving ? 'disabled' : ''}>${m.saving ? '저장하는 중…' : m.mode === 'edit' ? '수정 저장' : (S.page === 'inbox' ? '보관하기' : '할 일 추가')}</button>
      </form>
    </div>
  </div>`;
}

async function saveModal() {
  const m = S.modal; const v = m.v;
  if (!v.title.trim()) { m.error = '할 일 제목을 입력해 주세요.'; renderModal(); return; }
  m.saving = true; m.error = ''; renderModal();
  try {
    const data = { title: v.title.trim(), category: v.category, priority: v.priority, due_date: v.due_date || null, memo: v.memo };
    if (m.mode === 'edit') data.id = m.id;
    const saved = await rpc('dm_task_save', { p_data: data });
    closeModal();
    if (!saved.due_date) toast(m.mode === 'edit' && S.page === 'inbox' ? '수정했어요.' : 'INBOX에 보관했어요.');
    else if (saved.due_date > S.today) toast(`${fmtMD(saved.due_date)}로 일정을 잡았어요. 그날 TODAY에 보여요.`);
    else toast(m.mode === 'edit' && S.page === 'today' ? '수정했어요.' : '오늘 할 일에 넣었어요.');
    await refresh();
  } catch (e) {
    if (!S.modal) return;
    m.saving = false; m.error = '저장하지 못했어요. ' + e.message; renderModal();
  }
}

/* ---------- 할 일 동작 ---------- */
const allTasks = () => [...S.tasks, ...S.inbox, ...S.upcoming];
const findTask = id => allTasks().find(t => t.id === id);
const patchTask = (id, obj) => { for (const k of ['tasks', 'inbox', 'upcoming']) S[k] = S[k].map(t => t.id === id ? { ...t, ...obj } : t); };
const dropTask = id => { for (const k of ['tasks', 'inbox', 'upcoming']) S[k] = S[k].filter(t => t.id !== id); };

async function toggleTask(id) {
  const t = findTask(id); if (!t) return;
  const next = !t.is_completed;
  patchTask(id, { is_completed: next }); render();
  try { const saved = await rpc('dm_task_save', { p_data: { id, is_completed: next } }); patchTask(id, saved); render(); }
  catch (e) { patchTask(id, { is_completed: !next }); render(); toast('완료 상태를 저장하지 못했어요. ' + e.message, 'error'); }
}

async function deleteTask(id) {
  const t = findTask(id); if (!t) return;
  if (!confirm(`'${t.title}'을(를) 삭제할까요?`)) return;
  const snap = { tasks: S.tasks, inbox: S.inbox, upcoming: S.upcoming };
  dropTask(id); render();
  try { await rpc('dm_task_delete', { p_id: id }); toast('삭제했어요.'); }
  catch (e) { Object.assign(S, snap); render(); toast('삭제하지 못했어요. ' + e.message, 'error'); }
}

async function moveToday(id) {
  const t = findTask(id); if (!t) return;
  const snap = { inbox: S.inbox, upcoming: S.upcoming };
  dropTask(id); render();
  try { await rpc('dm_task_save', { p_data: { id, due_date: S.today } }); toast(`'${t.title}'을(를) 오늘 할 일로 옮겼어요.`); }
  catch (e) { Object.assign(S, snap); render(); toast('오늘로 옮기지 못했어요. ' + e.message, 'error'); }
}

/* ---------- 루틴·생활 기록 ---------- */
async function toggleRoutine(rid, d) {
  const k = lk(rid, d), next = !S.logs[k];
  S.logs[k] = next; render();
  try { await rpc('dm_routine_set', { p_routine: rid, p_date: d, p_done: next }); }
  catch (e) { S.logs[k] = !next; render(); toast('루틴 체크를 저장하지 못했어요. ' + e.message, 'error'); }
}

async function toggleDaily(d, field) {
  const prev = S.daily[d] ? { ...S.daily[d] } : null;
  const next = !(prev && prev[field]);
  S.daily[d] = { ...(prev || { log_date: d }), [field]: next }; render();
  try { S.daily[d] = await rpc('dm_daily_set', { p_date: d, p_data: { [field]: next } }); render(); }
  catch (e) { if (prev) S.daily[d] = prev; else delete S.daily[d]; render(); toast('기록을 저장하지 못했어요. ' + e.message, 'error'); }
}

async function saveMemo(d) {
  const v = (S.memoDraft[d] || '').trim();
  if (v === ((S.daily[d] && S.daily[d].memo) || '')) return;
  try { S.daily[d] = await rpc('dm_daily_set', { p_date: d, p_data: { memo: v } }); toast(`${fmtMD(d)} 메모를 저장했어요.`); }
  catch (e) { toast('메모를 저장하지 못했어요. ' + e.message, 'error'); }
}

async function saveMood() {
  const v = S.mood.trim();
  if (v === ((S.daily[S.today] && S.daily[S.today].mood) || '')) return;
  try { S.daily[S.today] = await rpc('dm_daily_set', { p_date: S.today, p_data: { mood: v } }); toast('오늘의 한 줄을 저장했어요.'); }
  catch (e) { toast('오늘의 한 줄을 저장하지 못했어요. ' + e.message, 'error'); }
}

async function addFree() {
  const title = S.freeNew.trim(); if (!title) return;
  try { const a = await rpc('dm_free_add', { p_title: title }); S.free.push(a); S.freeNew = ''; render(); const el = $('#free-new'); if (el) el.focus(); }
  catch (e) { toast('활동을 추가하지 못했어요. ' + e.message, 'error'); }
}

async function hideFree(id) {
  const snap = S.free;
  S.free = S.free.filter(a => a.id !== id); render();
  try { await rpc('dm_free_hide', { p_id: id }); }
  catch (e) { S.free = snap; render(); toast('활동을 지우지 못했어요. ' + e.message, 'error'); }
}

/* ---------- 잠금·설정 화면 ---------- */
const viewLock = () => `
  <div class="center"><div class="box">
    ${logo()}
    <p>나만 쓰는 비공개 페이지예요.<br>처음 한 번만 접속 키를 넣어 주세요. 이 기기에 기억돼요.</p>
    <form data-form="lock">
      <input id="lock-key" type="password" class="inp" autocomplete="current-password" placeholder="접속 키" aria-label="접속 키">
      ${S.lockMsg ? `<p class="err" role="alert">${esc(S.lockMsg)}</p>` : ''}
      <button type="submit" class="submit">들어가기</button>
    </form>
  </div></div>`;

function showSetup() {
  const sql = $('#setup-sql').textContent.trim();
  $('#app').innerHTML = `
  <div class="setup">
    ${logo()}
    <h1>처음 설정이 필요해요</h1>
    <ol>
      <li>Supabase에서 프로젝트를 열고 <b>SQL Editor</b>로 이동</li>
      <li>아래 SQL을 복사해 붙여넣고, 맨 위 <code>여기에_접속키</code>를 나만의 접속 키(12자 이상)로 바꾼 뒤 <b>Run</b></li>
      <li><b>Project Settings → API</b>에서 <b>Project URL</b>과 <b>anon public</b>(또는 Publishable) 키를 복사</li>
      <li>이 index.html 파일 아래쪽 <code>SUPABASE_URL</code>, <code>SUPABASE_ANON_KEY</code> 따옴표 안에 붙여넣고 저장</li>
      <li>GitHub에 올린 뒤 페이지를 열고 접속 키 입력</li>
    </ol>
    <button class="btn" data-act="copy-sql">SQL 복사</button>
    <textarea readonly aria-label="설정 SQL">${esc(sql)}</textarea>
  </div>`;
}

/* ---------- 그리기 ---------- */
const VIEWS = { today: viewToday, inbox: viewInbox, weekly: viewWeekly, mylife: viewMyLife };

function render() {
  if (S.locked) { $('#app').innerHTML = viewLock(); return; }
  const active = document.activeElement;
  const keepId = active && (active.id === 'mood' || active.id === 'free-new') ? active.id : null;
  $('#app').innerHTML = `<div class="shell">${viewSide()}<main class="main"><div class="wrap">${VIEWS[S.page]()}</div></main>${viewBottomNav()}</div>`;
  if (keepId) { const el = document.getElementById(keepId); if (el) { el.focus(); const n = el.value.length; try { el.setSelectionRange(n, n); } catch {} } }
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id, d = el.dataset.date;
  switch (a) {
    case 'noop': return;
    case 'retry': loadPage(); break;
    case 'task-new': openModal('new'); break;
    case 'task-edit': { const t = findTask(id); if (t) openModal('edit', t); break; }
    case 'task-toggle': toggleTask(id); break;
    case 'task-del': deleteTask(id); break;
    case 'task-today': moveToday(id); break;
    case 'routine': toggleRoutine(id, d); break;
    case 'daily': toggleDaily(d, el.dataset.field); break;
    case 'free-add': addFree(); break;
    case 'free-hide': hideFree(id); break;
    case 'inbox-done': S.showInboxDone = !S.showInboxDone; render(); break;
    case 'week-prev': S.weekStart = addDays(S.weekStart, -7); loadPage(); break;
    case 'week-next': S.weekStart = addDays(S.weekStart, 7); loadPage(); break;
    case 'week-this': S.weekStart = weekStart(S.today); loadPage(); break;
    case 'ml-period': S.mlPeriod = el.dataset.val; S.mlAnchor = S.today; loadPage(); break;
    case 'ml-prev': S.mlAnchor = S.mlPeriod === 'week' ? addDays(weekStart(S.mlAnchor), -7) : addMonths(S.mlAnchor, -1); loadPage(); break;
    case 'ml-next': S.mlAnchor = S.mlPeriod === 'week' ? addDays(weekStart(S.mlAnchor), 7) : addMonths(S.mlAnchor, 1); loadPage(); break;
    case 'ml-this': S.mlAnchor = S.today; loadPage(); break;
    case 'm-close': if (e.target.closest('[data-act]') === el) closeModal(); break;
    case 'm-cat': S.modal.v.category = el.dataset.val; renderModal(); break;
    case 'm-pri': S.modal.v.priority = el.dataset.val; renderModal(); break;
    case 'm-today': S.modal.v.due_date = S.today; renderModal(); break;
    case 'm-nodate': S.modal.v.due_date = null; renderModal(); break;
    case 'copy-sql': {
      const sql = $('#setup-sql').textContent.trim();
      (navigator.clipboard ? navigator.clipboard.writeText(sql) : Promise.reject())
        .then(() => toast('SQL을 복사했어요.'))
        .catch(() => toast('복사하지 못했어요. 아래 칸을 직접 선택해 복사해 주세요.', 'error'));
      break;
    }
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'mood') S.mood = t.value;
  else if (t.id === 'free-new') S.freeNew = t.value;
  else if (t.dataset && t.dataset.memo) S.memoDraft[t.dataset.memo] = t.value;
  else if (S.modal && t.id === 'm-title') S.modal.v.title = t.value;
  else if (S.modal && t.id === 'm-memo') S.modal.v.memo = t.value;
  else if (S.modal && t.id === 'm-date') { S.modal.v.due_date = t.value || null; renderModalChipsOnly(); }
});

function renderModalChipsOnly() {
  // 날짜 입력 중 포커스가 튀지 않도록 칩 상태만 갱신
  document.querySelectorAll('[data-act="m-today"]').forEach(b => b.classList.toggle('on', S.modal.v.due_date === S.today));
  document.querySelectorAll('[data-act="m-nodate"]').forEach(b => b.classList.toggle('on', !S.modal.v.due_date));
}

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'mood') saveMood();
  else if (t.dataset && t.dataset.memo) saveMemo(t.dataset.memo);
});

document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Escape' && S.modal) { closeModal(); return; }
  if (e.key !== 'Enter' || e.isComposing) return;
  if (t.id === 'mood' || (t.dataset && t.dataset.memo)) { e.preventDefault(); t.blur(); }
  else if (t.id === 'free-new') { e.preventDefault(); addFree(); }
});

document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  if (f === 'task') saveModal();
  if (f === 'lock') {
    const v = ($('#lock-key').value || '').trim();
    if (!v) return;
    setKey(v);
    S.locked = false;
    try {
      await rpc('dm_check');
      S.locked = false; S.lockMsg = '';
      route();
    } catch (err) {
      if (!S.locked) { setKey(''); S.lockMsg = err.message; S.locked = true; render(); }
    }
  }
});

document.addEventListener('visibilitychange', () => {
  // 다음 날 앱을 다시 열면 오늘 날짜로 새로고침
  if (!document.hidden && sb && !S.locked && S.today && todayStr() !== S.today) {
    S.weekStart = weekStart(todayStr()); S.mlAnchor = todayStr(); route();
  }
});

/* ---------- 시작 ---------- */
(function boot() {
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) { showSetup(); return; }
  if (!window.supabase) {
    $('#app').innerHTML = `<div class="err-card"><p class="t">불러오지 못했어요</p><p class="m">Supabase 라이브러리를 받지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</p></div>`;
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
  const u = new URL(location.href), k = u.searchParams.get('key');
  if (k !== null) { setKey(k.trim()); u.searchParams.delete('key'); history.replaceState(null, '', u.pathname + u.search + u.hash); }
  window.addEventListener('hashchange', route);
  if (!getKey()) { S.locked = true; render(); return; }
  route();
})();
</script>
</body>
</html>
